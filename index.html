<style>
        html { overscroll-behavior:none; scrollbar-color:rgba(63,174,108,0.4) transparent; }
        body {
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            color:#e0e0e0; min-height:100vh; overflow-x:hidden;
            position:relative; overscroll-behavior:none;
            background:linear-gradient(135deg,rgb(3,14,8) 0%,rgb(8,22,13) 50%,rgb(2,10,5) 100%) fixed #030d08;
        }
        body::after {
            content:''; position:fixed; inset:0; z-index:0;
            background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.5) 100%);
            pointer-events:none;
        }.glow-orb{animation:orbIn 2s ease forwards}
        @keyframes orbIn { to{opacity:1} }
        .glow-orb-1 { width:clamp(260px,55vw,550px); height:clamp(260px,55vw,550px); top:-120px; right:-100px; background:rgba(20,90,50,0.4); }
        .glow-orb-2 { width:clamp(210px,45vw,450px); height:clamp(210px,45vw,450px); bottom:-100px; left:-80px; background:rgba(10,60,35,0.35); }
        .container { max-width:850px; margin:0 auto; padding:40px 20px; position:relative; z-index:1; }

        /* КНОПКИ */
        .lang-btn {
            position:fixed; top:64px; right:20px; z-index:100;
            backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
            background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.1);
            color:#fff; width:60px; height:36px; padding:0; border-radius:15px; cursor:pointer;
            font-size:0.85em; font-weight:300; letter-spacing:1px;
            transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.3s cubic-bezier(0.4,0,0.2,1),background-color 0.3s cubic-bezier(0.4,0,0.2,1),border-color 0.3s cubic-bezier(0.4,0,0.2,1),box-shadow 0.3s cubic-bezier(0.4,0,0.2,1); text-transform:uppercase;
            box-shadow:0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .lang-btn:hover { border-color:rgba(255,255,255,0.2); transform:scale(1.05); background:rgba(255,255,255,0.12); }
        .menu-btn {
            position:fixed; top:20px; right:20px; z-index:100;
            backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
            background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.1);
            width:60px; height:36px; border-radius:15px; cursor:pointer;
            display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px;
            transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.3s cubic-bezier(0.4,0,0.2,1),background-color 0.3s cubic-bezier(0.4,0,0.2,1),border-color 0.3s cubic-bezier(0.4,0,0.2,1),box-shadow 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow:0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .menu-btn span { width:20px; height:2px; background:#fff; border-radius:2px; transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.3s cubic-bezier(0.4,0,0.2,1),background-color 0.3s cubic-bezier(0.4,0,0.2,1),border-color 0.3s cubic-bezier(0.4,0,0.2,1),box-shadow 0.3s cubic-bezier(0.4,0,0.2,1); opacity:0.85; }
        .menu-btn.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
        .menu {
            position:fixed; top:-100%; left:0; width:100%;
            backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
            background:rgba(3,12,6,0.92); border-bottom:1px solid rgba(255,255,255,0.08);
            box-shadow:0 8px 32px rgba(0,0,0,0.5); z-index:99;
            transition:top 0.4s cubic-bezier(0.4,0,0.2,1); padding:28px 40px 30px;
        }
        .menu-items { list-style:none; display:flex; justify-content:center; align-items:center; gap:60px; }

        @keyframes fadeSlideDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeSlideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

        header { text-align:center; padding:100px 20px 70px; animation:fadeSlideDown 1s ease forwards; }
        h1 { font-size:4em; font-weight:200; letter-spacing:8px; margin-bottom:16px; background:linear-gradient(135deg,#ffffff 0%,rgba(180,255,210,0.65) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .subtitle { font-size:1.15em; color:rgba(120,220,160,0.4); font-weight:300; letter-spacing:3px; text-transform:uppercase; }
        .divider { width:50%; height:1px; background:linear-gradient(90deg,transparent,rgba(80,180,120,0.2),transparent); margin:0 auto 70px; }

        .about-card { position:relative; text-align:center; padding:20px 20px 60px; animation:fadeSlideUp 1s 0.3s ease both; }
        .about-card-inner { position:relative; z-index:1; }
        .card-accent-bar { width:50px; height:1px; border-radius:2px; margin:28px auto 32px; background:linear-gradient(90deg,rgba(80,200,130,0.85),transparent); }
        .card-desc { font-size:1em; color:rgba(255,255,255,0.32); font-weight:300; letter-spacing:1px; line-height:1.7; }
        .photo-wrap { width:240px; height:240px; margin:0 auto 32px; border-radius:50%; padding:3px; background:linear-gradient(135deg,rgba(120,240,160,0.55),rgba(20,90,50,0.15)); box-shadow:0 0 60px rgba(60,200,110,0.25),0 12px 40px rgba(0,0,0,0.5); }
        .photo { display:block; width:100%; height:100%; border-radius:50%; object-fit:cover; background:#0a2a16; }
        .links { display:flex; justify-content:center; flex-wrap:wrap; gap:18px; margin:10px 0 0; }
        .link-btn { display:inline-flex; align-items:center; justify-content:center; min-width:190px; gap:12px; padding:18px 36px; border:2px solid rgba(255,255,255,0.12); border-radius:60px; color:#c8c8c8; text-decoration:none; font-size:1em; font-weight:400; letter-spacing:1.5px; white-space:nowrap; transition:background 0.3s ease,border-color 0.3s ease,box-shadow 0.3s ease,color 0.3s ease,transform 0.3s ease; }
        .link-btn svg { width:22px; height:22px; flex-shrink:0; opacity:0.8; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4)); transition:opacity 0.3s ease; }
        .link-btn[data-platform=github]:hover { background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.45); box-shadow:0 0 22px rgba(255,255,255,0.12),0 6px 20px rgba(0,0,0,0.4); color:#fff; transform:translateY(-3px); }
        .link-btn[data-platform=youtube]:hover { background:rgba(255,0,0,0.07); border-color:rgba(255,60,60,0.5); box-shadow:0 0 22px rgba(255,40,40,0.25),0 6px 20px rgba(255,0,0,0.2); color:#ff8a8a; transform:translateY(-3px); }
        .link-btn:hover svg { opacity:1; }

        footer { text-align:center; padding:80px 20px 60px; color:rgba(255,255,255,0.2); font-size:0.82em; font-weight:300; letter-spacing:1px; }

        .copyright { cursor:pointer; display:inline-block; transition:color 0.3s ease; user-select:none; position:relative; z-index:1; }
        .copyright:hover { color:rgba(255,255,255,0.45); }
        .hidden-socials { max-height:0; overflow:hidden; transition:max-height 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.4s ease,margin-top 0.5s ease; opacity:0; margin-top:0; }
        .hidden-socials.show { max-height:100px; opacity:1; margin-top:30px; }
        .hidden-socials.expanded { overflow:visible; }
        .social-links-row { display:flex; gap:20px; justify-content:center; }
        .social-link { display:flex; align-items:center; justify-content:center; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),border-color 0.4s cubic-bezier(0.4,0,0.2,1),box-shadow 0.4s cubic-bezier(0.4,0,0.2,1); position:relative; will-change:transform; }
        .social-link::before { content:''; position:absolute; inset:0; border-radius:50%; opacity:0; transition:opacity 0.4s ease; }
        .social-link[data-social=twitter]::before { background:radial-gradient(circle,rgba(29,161,242,0.3),transparent 70%); }
        .social-link[data-social=telegram]::before { background:radial-gradient(circle,rgba(0,136,204,0.3),transparent 70%); }
        .social-link:hover::before { opacity:1; }
        .social-link:hover { transform:translateY(-3px) scale(1.1); border-color:rgba(255,255,255,0.3); box-shadow:0 5px 20px rgba(0,0,0,0.4); }
        .social-link svg { width:24px; height:24px; fill:#c8c8c8; transition:fill 0.3s ease; position:relative; z-index:1; }
        .social-link:hover svg { fill:#fff; }
        @media (max-width:768px) {
            h1{font-size:2.8em;letter-spacing:4px} header{padding:70px 20px 50px}
            .photo-wrap{width:180px;height:180px} .menu-items{flex-direction:column;gap:24px}
        }

        /* ПРОЕКТЫ — бегущая лента */
        .projects { position:relative; margin:0 0 56px; animation:fadeSlideUp 1s 0.5s ease both; --cw:290px; }
        .section-title { text-align:center; font-size:0.85em; font-weight:300; letter-spacing:4px; text-transform:uppercase; color:rgba(120,220,160,0.55); margin-bottom:22px; }
        .proj-track {
            position:relative; overflow:hidden; padding:16px 0 26px; cursor:grab; touch-action:pan-y;
            -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
                    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
        }
        .proj-track.dragging { cursor:grabbing; }
        .proj-track.dragging .proj-card { pointer-events:none; }
        .proj-strip { display:flex; gap:18px; width:max-content; will-change:transform; }
        .proj-card { flex:0 0 var(--cw); display:block; text-decoration:none; color:inherit; -webkit-user-drag:none; user-select:none; outline:none; }
        .proj-card.no-link { cursor:inherit; }
        .proj-inner {
            position:relative; height:100%; display:flex; flex-direction:column; padding:24px 24px 20px; border-radius:22px;
            background:linear-gradient(160deg,rgba(255,255,255,0.065),rgba(255,255,255,0.02));
            border:1px solid rgba(255,255,255,0.09);
            box-shadow:0 10px 30px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.06);
            transition:transform 0.45s cubic-bezier(0.22,1,0.36,1),border-color 0.3s ease,box-shadow 0.3s ease;
        }
        .proj-inner::before { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
            background:radial-gradient(120% 70% at 0% 0%,var(--c,#5fd08f) 0%,transparent 55%); opacity:0.1; transition:opacity 0.3s ease; }
        .proj-card:hover .proj-inner, .proj-card:focus-visible .proj-inner {
            transform:translateY(-6px); border-color:rgba(150,240,185,0.4);
            box-shadow:0 18px 40px rgba(0,0,0,0.5),0 0 32px rgba(60,200,110,0.12),inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .proj-card:hover .proj-inner::before { opacity:0.2; }
        .proj-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
        .proj-icon { width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
            background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); color:#d8f5e3; }
        .proj-icon svg { width:22px; height:22px; }
        .proj-lang { display:flex; align-items:center; gap:7px; font-size:0.78em; letter-spacing:1px; color:rgba(255,255,255,0.45); }
        .proj-lang i { width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
        .proj-name { font-size:1.2em; font-weight:400; letter-spacing:1px; color:#f0f0f0; margin-bottom:9px; }
        .proj-desc { font-size:0.88em; line-height:1.6; color:rgba(255,255,255,0.55); font-weight:300; }
        .proj-more { display:inline-flex; align-self:flex-start; align-items:center; gap:6px; margin-top:auto; padding-top:16px; font-size:0.8em; letter-spacing:1.5px; text-transform:uppercase; color:rgba(150,240,185,0.75); }
        .proj-more b { font-weight:400; display:inline-block; transition:transform 0.3s ease; }
        .proj-card:hover .proj-more b { transform:translateX(4px); }
        .proj-more.soon { color:rgba(255,255,255,0.35); }
        .proj-cta { text-align:center; max-width:520px; margin:22px auto 0; padding:0 10px; font-size:0.95em; font-weight:300; letter-spacing:0.5px; line-height:1.7; color:rgba(255,255,255,0.55); }
        .proj-cta a { display:inline-block; margin-top:6px; color:rgba(150,240,185,0.85); text-decoration:none; border-bottom:1px solid rgba(150,240,185,0.3); transition:color 0.3s ease,border-color 0.3s ease; }
        .proj-cta a:hover { color:#fff; border-bottom-color:rgba(255,255,255,0.6); }
        /* мобильная лента — обязательно ПОСЛЕ основных правил ленты, иначе они её перебивают */
        @media (max-width:768px) {
            .projects{--cw:min(72vw,280px)} .proj-inner{padding:20px 20px 18px} .proj-strip{gap:14px}
            .proj-track{-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
        }
    </style>
</head>

    <script>
        
        let clickCount=0,clickTimer=null;
        function toggleHiddenSocials(){if(++clickCount===3){const t=document.getElementById('hiddenSocials'),opening=!t.classList.contains('show');t.classList.toggle('show');if(opening){t.addEventListener('transitionend',function e(n){if(n.propertyName==='max-height'){t.classList.add('expanded');t.removeEventListener('transitionend',e)}})}else{t.classList.remove('expanded')}clickCount=0}clearTimeout(clickTimer);clickTimer=setTimeout(()=>{clickCount=0},1000)}
        let currentLang='ru';
        function switchLanguage(){const nl=currentLang==='ru'?'en':'ru';document.getElementById('langBtn').textContent=nl==='ru'?'EN':'RU';document.querySelectorAll('[data-ru][data-en]').forEach(el=>el.textContent=nl==='ru'?el.getAttribute('data-ru'):el.getAttribute('data-en'));currentLang=nl}

        // ПРОЕКТЫ — данные (ru/en руками, чтобы переключатель языка работал)
        // repo: имя репозитория у Slava-Gusak или полная ссылка; null — карточка без ссылки
        const PROJECTS=[
            {repo:'nitro-control',name:'Nitro Control',lang:'Rust',c:'#dea584',icon:'fan',
             ru:'Облегчённая альтернатива фирменного приложения для управления вентиляторами моего ноутбука. Без лишних анимаций и настроек аудио (мне нужно управлять вентиляторами, а не переключаться между аудио пресетами).',
             en:'A lightweight alternative to the stock app for controlling my laptop\'s fans. No pointless animations or audio settings (I need to control fans, not switch between sound presets).'},
            {repo:'https://github.com/LiteLaunch/litelaunch',name:'Lite Launch',lang:'Rust',c:'#dea584',icon:'key',
             ru:'Альтернатива моему любимому Flow Launcher, но написанная на Rust, поэтому ест в 20 раз меньше оперативки.',
             en:'An alternative to my favourite Flow Launcher, but written in Rust, so it eats 20 times less RAM.'},
            {repo:'claude-watch',name:'Claude Watch',lang:'Kotlin',c:'#a97bff',icon:'watch',
             ru:'Представьте: вы идёте по улице и важно смотрите на часы. Прохожие думают, что вы крайне занятой человек, судя по тому, с каким лицом вы смотрите на оставшиеся лимиты.',
             en:'Picture this: you walk down the street, glancing at your watch with importance. Passers-by think you\'re an extremely busy person, judging by the look on your face as you check your remaining limits.'},
            {repo:'yad-flow-plugin',name:'YaD for Flow',lang:'Python',c:'#4b8bd6',icon:'down',
             ru:'Плагин для моего любимого Flow Launcher: качает музло с Яндекс Музыки прямо из лаунчера. Кстати, в Lite Launch он тоже работает)',
             en:'A plugin for my favourite Flow Launcher: grabs music from Yandex Music right from the launcher. By the way, it works in Lite Launch too)'},
            {repo:'Smart-Link',name:'Smart-Link',lang:'HTML',c:'#e8673f',icon:'link',
             ru:'Альтернатива страничкам, что делают band.link или Linktree, только без трекеров и прочей фигни (я просто знаю, что никто не заходит на мой сайт).',
             en:'An alternative to the pages band.link or Linktree make, just without trackers and other junk (I simply know nobody visits my site).'}
        ];
        const PROJ_ICONS={
            fan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7 2 0 3 2 2 4l-4 4M14 12c4 0 7 1 7 4 0 2-2 3-4 2l-4-4M12 14c0 4-1 7-4 7-2 0-3-2-2-4l4-4M10 12c-4 0-7-1-7-4 0-2 2-3 4-2l4 4"/></svg>',
            key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M6.5 17.5h11"/><path d="M9.5 12.5l5-5M10.5 7.5h4v4"/></svg>',
            watch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="4"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 9.5V12l1.5 1.5"/></svg>',
            down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
            link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
        };
        (function initProjects(){
            const track=document.getElementById('projTrack'),strip=document.getElementById('projStrip');
            if(!track) return;
            const L=(ru,en)=>currentLang==='en'?en:ru;
            const esc=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
            const card=p=>{
                const tag=p.repo?'a':'div';
                const attrs=p.repo?' href="'+(p.repo.startsWith('http')?p.repo:'https://github.com/Slava-Gusak/'+p.repo)+'" target="_blank" rel="noopener" draggable="false"':'';
                const more=p.repo
                    ?'<span class="proj-more"><span data-ru="Открыть на GitHub" data-en="Open on GitHub">'+L('Открыть на GitHub','Open on GitHub')+'</span><b>→</b></span>'
                    :'<span class="proj-more soon"><span data-ru="Скоро на GitHub" data-en="Coming to GitHub">'+L('Скоро на GitHub','Coming to GitHub')+'</span></span>';
                return '<'+tag+' class="proj-card'+(p.repo?'':' no-link')+'"'+attrs+' style="--c:'+p.c+'">'+
                    '<div class="proj-inner"><div class="proj-head"><div class="proj-icon">'+PROJ_ICONS[p.icon]+'</div>'+
                    '<span class="proj-lang"><i></i>'+p.lang+'</span></div>'+
                    '<div class="proj-name">'+esc(p.name)+'</div>'+
                    '<p class="proj-desc" data-ru="'+esc(p.ru)+'" data-en="'+esc(p.en)+'">'+esc(L(p.ru,p.en))+'</p>'+more+
                    '</div></'+tag+'>';
            };
            const one=PROJECTS.map(card).join('');
            strip.innerHTML=one;
            // копий ленты столько, чтобы она всегда перекрывала экран — тогда шов не виден
            let setW=0;
            function fill(){
                // длина одного набора = расстояние между первой карточкой и её копией.
                // scrollWidth для этого не годится: Firefox считает ширину ленты по тексту карточек без переносов (~1000px на карточку)
                strip.innerHTML=one+one;
                setW=strip.children[PROJECTS.length].getBoundingClientRect().left-strip.children[0].getBoundingClientRect().left;
                const copies=Math.max(2,Math.ceil(track.clientWidth/setW)+1);
                strip.innerHTML=one.repeat(copies);
                [...strip.children].forEach((c,i)=>{if(i>=PROJECTS.length){c.setAttribute('aria-hidden','true');c.tabIndex=-1}});
                strip.querySelectorAll('[data-ru][data-en]').forEach(el=>el.textContent=el.getAttribute(currentLang==='en'?'data-en':'data-ru'));
            }
            fill();

            const SPEED=32;                       // px в секунду
            let x=0,v=SPEED,target=v,last=performance.now(),hover=false,focused=false,visible=true;
            const wrap=()=>{x=((x%setW)+setW)%setW};
            function frame(now){
                const dt=Math.min(0.05,(now-last)/1000);last=now;
                v+=(target-v)*Math.min(1,dt*4);    // скорость меняется плавно: лента мягко тормозит и разгоняется
                if(!drag.on){x+=v*dt;wrap()}
                strip.style.transform='translate3d('+(-x).toFixed(2)+'px,0,0)';
                raf=requestAnimationFrame(frame);
            }
            let raf=null;
            function run(){ if(raf===null&&visible&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)} }
            function stop(){ if(raf!==null){cancelAnimationFrame(raf);raf=null} }
            const updTarget=()=>{target=(hover||focused||drag.on)?0:SPEED};

            // наведение настоящей мышью — лента плавно замирает, карточка приподнимается.
            // Тап пальцем шлёт фальшивый mouseenter без mouseleave, поэтому смотрим только pointerType=mouse.
            track.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){hover=true;updTarget()}});
            track.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hover=false;updTarget()}});
            // фокус останавливает ленту только при навигации с клавиатуры (Tab), а не после клика или тапа по карточке
            track.addEventListener('focusin',e=>{focused=e.target.matches(':focus-visible');updTarget()});
            track.addEventListener('focusout',()=>{focused=false;updTarget()});

            // перетаскивание мышью и пальцем (вертикальный скролл страницы не мешает — touch-action:pan-y)
            const drag={on:false,moved:false,sx:0,x0:0,id:null,lx:0,lt:0,vel:0};
            track.addEventListener('pointerdown',e=>{
                if(e.pointerType==='mouse'&&e.button!==0) return;
                drag.on=true;drag.moved=false;drag.sx=e.clientX;drag.x0=x;drag.id=e.pointerId;drag.lx=e.clientX;drag.lt=performance.now();drag.vel=0;updTarget();
            });
            window.addEventListener('pointermove',e=>{
                if(!drag.on||e.pointerId!==drag.id) return;
                const dx=e.clientX-drag.sx;
                if(!drag.moved&&Math.abs(dx)>6){drag.moved=true;track.classList.add('dragging');try{track.setPointerCapture(drag.id)}catch(_){}}
                if(drag.moved){
                    x=drag.x0-dx;wrap();
                    const t=performance.now(),dt=(t-drag.lt)/1000;
                    if(dt>0){drag.vel=-(e.clientX-drag.lx)/dt;drag.lx=e.clientX;drag.lt=t}
                }
            });
            const end=e=>{
                if(!drag.on||(e&&e.pointerId!==drag.id)) return;
                drag.on=false;track.classList.remove('dragging');
                if(drag.moved){
                    v=Math.max(-1500,Math.min(1500,drag.vel));   // отпустил — лента катится по инерции и возвращается к своему темпу
                    const stopClick=ev=>{ev.preventDefault();ev.stopPropagation()};
                    track.addEventListener('click',stopClick,{capture:true,once:true});
                    setTimeout(()=>track.removeEventListener('click',stopClick,{capture:true}),0);
                }
                if(e&&e.pointerType!=='mouse') hover=false;
                updTarget();
            };
            window.addEventListener('pointerup',end);
            window.addEventListener('pointercancel',end);
            track.addEventListener('click',e=>{const c=e.target.closest('.no-link');if(c)e.preventDefault()});

            document.addEventListener('visibilitychange',()=>document.hidden?stop():run());
            if('IntersectionObserver' in window) new IntersectionObserver(es=>{visible=es[0].isIntersecting;visible?run():stop()}).observe(track);
            let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const k=x/setW;fill();x=k*setW;wrap()},150)});
            run();
        })();
    </script>
<script src="common.js" defer></script>
</body>
