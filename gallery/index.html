function initOrbs(){
const o1=document.getElementById('orb1'),o2=document.getElementById('orb2');
document.body.style.background='linear-gradient(135deg,rgb(30,18,4) 0%,rgb(45,25,6) 50%,rgb(22,12,2) 100%)';
o1.style.background='rgba(160,90,10,0.4)';

void o1.offsetWidth; void o2.offsetWidth;
o1.style.transition='opacity 2s ease'; o2.style.transition='opacity 2s ease';
o1.style.opacity='1'; o2.style.opacity='1';
}

let clickCount = 0, clickTimer = null;
function toggleHiddenSocials(){
if (++clickCount === 3) {
const box = document.getElementById('hiddenSocials');
const opening = !box.classList.contains('show');
box.classList.toggle('show');
document.body.classList.toggle('gradient-active');
if (opening) {
box.addEventListener('transitionend', function done(e){
if (e.propertyName !== 'max-height') return;
box.classList.add('expanded');
box.removeEventListener('transitionend', done);
window.scrollTo({ top:document.documentElement.scrollHeight, behavior:'smooth' });
});
} else {
box.classList.remove('expanded');
}
clickCount = 0;
}
clearTimeout(clickTimer);
clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
}
function shakeSoon(el){
el.classList.remove('shaking'); void el.offsetWidth; el.classList.add('shaking');
el.addEventListener('animationend', () => el.classList.remove('shaking'), { once:true });
}
(function initWarren(){
const home = document.getElementById('homeLink'), link = document.getElementById('warrenLink'), glow = document.getElementById('warrenGlow');
if (!home || !link || !glow) return;
let holdTimer = null, chargeStart = null, raf = null, revealed = false, pressed = false, justRevealed = false;
function stopCharging(){ cancelAnimationFrame(raf); raf = null; home.classList.remove('warren-charging'); glow.style.opacity = '0'; }
function reveal(){ if (revealed) return; revealed = true; link.classList.add('revealed'); link.style.pointerEvents = 'auto'; }
function charge(t){
if (!chargeStart) chargeStart = t;
const k = Math.min((t - chargeStart) / 3000, 1);
glow.style.opacity = String(k);
if (k < 1) raf = requestAnimationFrame(charge);
else { stopCharging(); justRevealed = true; reveal(); }
}
function startCharging(){ holdTimer = null; chargeStart = null; home.classList.add('warren-charging'); raf = requestAnimationFrame(charge); }
function press(e){
if (e.type === 'mousedown' && e.button !== 0) return;
pressed = true;
if (!revealed) holdTimer = setTimeout(startCharging, 3000);
}
function release(){
const wasCharging = home.classList.contains('warren-charging'), wasWaiting = holdTimer !== null;
const wasPressed = pressed, wasJustRevealed = justRevealed;
pressed = false; justRevealed = false;
clearTimeout(holdTimer); holdTimer = null;
if (revealed) { if (wasPressed && !wasJustRevealed) location.href = '/'; }
else {
stopCharging();
if (wasCharging) shakeSoon(home);            // отпустил во время «зарядки» — тряска, ссылка не появилась
else if (wasWaiting) location.href = '/';   // короткое нажатие — просто переход на главную
}
}
home.addEventListener('mousedown', press);
home.addEventListener('touchstart', press, { passive:true });
document.addEventListener('mouseup', release);
document.addEventListener('touchend', release);
document.addEventListener('touchcancel', release);
home.addEventListener('contextmenu', e => e.preventDefault());
})();
function toggleMenu(){document.getElementById('mainMenu').classList.toggle('active');document.getElementById('menuOverlay').classList.toggle('active');document.getElementById('menuBtn').classList.toggle('open')}
let currentLang='ru';
function switchLanguage(){
const nl=currentLang==='ru'?'en':'ru';
document.getElementById('langBtn').textContent=nl==='ru'?'EN':'RU';
document.querySelectorAll('[data-ru][data-en]').forEach(el=>el.textContent=nl==='ru'?el.getAttribute('data-ru'):el.getAttribute('data-en'));
currentLang=nl;
updateGridCaptions(); // подписи к фото тоже следуют за языком
if (document.getElementById('lightbox').classList.contains('active')) {
updateLbText();
if (isReadOpen()) { renderTranscript(photos[lbIndex].transcript[currentLang]); setReadOpen(true); }
}
}

const PAPER_TEXT = {
source: 'Новости ЕВРАЗа · 29.12.2011',
title: 'Мама, папа, я — талантливая семья',
lead: '23 декабря в МВЦ НТМК открылась большая новогодняя выставка декоративно-прикладного творчества по итогам конкурса «Талантливая семья ЕВРАЗа». В этот раз в ней приняли участие 80 семей работников уральских предприятий компании — НТМК, ВГОКа, НСМЗ и КГОКа.',
body: [
'Многие конкурсанты претендовали на первые места сразу в нескольких номинациях, а всего их было пять: изобразительное, техническое декоративно-прикладное творчество, рукоделие, жанровая фотография и оригинальное хобби.',
'— Когда пять лет назад мы впервые организовали такой конкурс, очень надеялись, что он понравится работникам ЕВРАЗа, — рассказала Елена Раудштейн. — Сегодня на выставке представлено уже более 700 работ. В числе авторов — ребята из подшефных социальных учреждений и детских домов. Мы рады, что в конкурсе активно принимают участие дети, ведь если родители делают мир сильнее, то дети — краше.',
['Торжественную церемонию награждения открыла ', { hl: 'семья музыкантов Гусак: Виктор, Мила и их трехлетний сын Святослав' }, '. Малыш недавно взял в руки ', { hl: 'свою первую в жизни скрипку' }, ', а уже выступил в ансамбле с родителями и сыграл песенку «Маленькая елочка».'],
'В зрительном зале также собралось немало тех, кто только делает свои первые шаги в искусстве. Например, Настя Шилова всего второй год посещает художественную школу, а к конкурсу успела подготовить пять различных работ.',
'— Мама прочитала в корпоративной газете о конкурсе, — рассказывает Настя, — и предложила поучаствовать. Для выставки я выбрала свои лучшие рисунки.',
'Мама девочки — инженер управления подготовки производства «ЕВРАЗ НТМК» Лидия Шилова призналась, что гордится успехами дочери и очень хотела, чтобы все узнали, какая талантливая у нее Настюша. Возможно, девочка выберет другую профессию, но любовь к творчеству останется, как, например, у дефектоскописта ультразвукового контроля РБЦ Ольги Рыжковой:',
'— Я в детстве с огромным удовольствием ходила в изостудию, однако профессию выбрала другую. Работу свою я люблю, но и дополнительных увлечений у меня масса. Я вяжу, шью, занимаюсь резьбой по дереву и бисероплетением. В конкурсе «Талантливая семья ЕВРАЗа» участвую в четвертый раз. В этом году принесла работы в технике декупаж, которой недавно увлеклась.',

const imgLoads = new Map(), imgLoaded = new Set();

imgLoads.set(src, ready.then(
() => { imgLoaded.add(src); },
e => { imgLoads.delete(src); throw e; } // не загрузилось — при следующей попытке пробуем снова

lbCleanup = () => { lbCleanup = null; ghost.remove(); };
const decoded = el => (el.decode ? el.decode() : Promise.resolve()).catch(() => {});
decoded(ghost).then(() => {

wrap.insertBefore(ghost, img.nextSibling);

if (token !== lbAnimToken) return;
ghost.style.transition = `opacity ${LB_SHARPEN_MS}ms cubic-bezier(0.22,0.7,0.2,1)`;

/* ============ СМЕНА ФОТО В ЛАЙТБОКСЕ (вариант A: морф рамки + кроссфейд) ============
1) берём новое фото, если оно уже загружено, иначе его размытую заглушку (она готова сразу,
поэтому листание не ждёт интернета) — подпись и фото меняются вместе; настоящее фото проявится потом
2) старое фото остаётся «призраком» поверх, рамка плавно тянется к размеру нового
3) фото перетекают друг в друга, подпись гаснет и проявляется в середине */
const LB_MS = 460, LB_EASE = 'cubic-bezier(0.4,0,0.2,1)';
const LB_SHARPEN_MS = 1200; // переход из размытой заглушки в чёткое фото
let lbAnimToken = 0, lbCleanup = null;
function cancelLbAnim(){
lbAnimToken++;
if (lbCleanup) lbCleanup();
document.getElementById('lbImg').classList.remove('lb-loading');
}
function swapLightboxPhoto(){
const token = ++lbAnimToken;
const src = lbSrcNow(photos[lbIndex]);
const wrap = document.getElementById('lbPhotoWrap');
const img = document.getElementById('lbImg');
const inner = document.getElementById('lbInfoInner');
const isMobile = window.matchMedia('(max-width:768px)').matches;
const infoOpen = document.getElementById('lbInfo').classList.contains('open');
const loadingTimer = setTimeout(() => { if (token === lbAnimToken) img.classList.add('lb-loading'); }, 200);
const pre = new Image();
pre.src = src;
const preReady = pre.decode ? pre.decode() : new Promise(r => { pre.onload = pre.onerror = r; });
preReady.catch(() => {}).then(() => {
clearTimeout(loadingTimer);
if (token !== lbAnimToken) return;
if (lbCleanup) lbCleanup();
img.classList.remove('lb-loading');
const ownSheetAnim = isMobile && infoOpen;
if (ownSheetAnim) {
applyLbState(); updateLbText();
} else {
inner.style.transition = 'opacity 0.16s ease, transform 0.16s ease';
inner.style.opacity = '0';
inner.style.transform = 'translateY(6px)';
}
const r0 = wrap.getBoundingClientRect();
const ghost = document.createElement('img');
ghost.className = 'lb-ghost';
ghost.alt = '';
ghost.src = img.currentSrc || img.src;
ghost.style.borderRadius = getComputedStyle(img).borderRadius;
wrap.insertBefore(ghost, img.nextSibling);
wrap.style.width = r0.width + 'px';
wrap.style.height = r0.height + 'px';
wrap.classList.add('lb-animating');
img.style.transition = 'none';
img.style.opacity = '0';
let textTimer = null, endTimer = null, textDone = ownSheetAnim;
lbCleanup = () => {
lbCleanup = null;
clearTimeout(textTimer); clearTimeout(endTimer);
if (!textDone) { textDone = true; applyLbState(); updateLbText(); }
ghost.remove();
wrap.classList.remove('lb-animating');
wrap.style.transition = ''; wrap.style.width = ''; wrap.style.height = '';
img.style.transition = ''; img.style.opacity = '';
inner.style.transition = ''; inner.style.opacity = ''; inner.style.transform = '';
};
img.src = src;
const sameAsPre = img.complete && img.naturalWidth === pre.naturalWidth && img.naturalHeight === pre.naturalHeight;
const imgReady = sameAsPre || !img.decode ? Promise.resolve() : img.decode();
imgReady.catch(() => {}).then(() => {
if (token !== lbAnimToken) return;
wrap.classList.remove('lb-animating');
wrap.style.width = ''; wrap.style.height = '';
const r1 = wrap.getBoundingClientRect();
wrap.style.width = r0.width + 'px';
wrap.style.height = r0.height + 'px';
wrap.classList.add('lb-animating');
void wrap.offsetWidth;
wrap.style.transition = `width ${LB_MS}ms ${LB_EASE}, height ${LB_MS}ms ${LB_EASE}`;
wrap.style.width = r1.width + 'px';
wrap.style.height = r1.height + 'px';
img.style.transition = `opacity ${LB_MS}ms ${LB_EASE}`;
ghost.style.transition = `opacity ${LB_MS}ms ${LB_EASE}`;
img.style.opacity = '1';
ghost.style.opacity = '0';
if (!textDone) textTimer = setTimeout(() => {
textDone = true;
applyLbState(); updateLbText();
inner.style.opacity = '1';
inner.style.transform = 'none';
}, 170);
endTimer = setTimeout(() => { if (lbCleanup) lbCleanup(); upgradeLb(); }, LB_MS + 40);
});
});
}
/* ============ «ПРОЧИТАТЬ» ============ */
function renderTranscript(t){
const box = document.getElementById('lbReadContent');
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
box.textContent = '';
box.append(el('p', 'lb-read-src', t.source), el('h4', 'lb-read-title', t.title), el('p', 'lb-read-lead', t.lead));
const body = el('div', 'lb-read-body');
t.body.forEach(par => {
const p = el('p');
(Array.isArray(par) ? par : [par]).forEach(seg => p.append(typeof seg === 'string' ? seg : el('span', 'lb-read-hl', seg.hl)));
body.append(p);
});
box.append(body, el('p', 'lb-read-author', t.author));
box.scrollTop = 0;
}
function setReadOpen(open, instant){
const panel = document.getElementById('lbRead');
const btn = document.getElementById('lbReadBtn');
if (instant) { panel.classList.add('lb-no-anim'); btn.classList.add('lb-no-anim'); }
const t = photos[lbIndex] && photos[lbIndex].transcript;
if (open && !t) return;
if (open) resetZoom(true);
if (open && !panel.classList.contains('open')) {
renderTranscript(t[currentLang] || t.ru);
void panel.offsetHeight; // чтобы строки красиво «проявились», а не появились сразу
}
panel.classList.toggle('open', open);
panel.setAttribute('aria-hidden', open ? 'false' : 'true');
btn.classList.toggle('open', open);
btn.setAttribute('aria-expanded', open ? 'true' : 'false');
const ru = currentLang === 'ru';
btn.setAttribute('aria-label', open ? (ru ? 'Закрыть текст' : 'Close text') : (ru ? 'Прочитать текст' : 'Read text'));
btn.title = open ? (ru ? 'Закрыть (R)' : 'Close (R)') : (ru ? 'Прочитать (R)' : 'Read (R)');
if (instant) {
void panel.offsetHeight;
panel.classList.remove('lb-no-anim'); btn.classList.remove('lb-no-anim');
}
}
function toggleRead(){ setReadOpen(!document.getElementById('lbRead').classList.contains('open')); }
function isReadOpen(){ return document.getElementById('lbRead').classList.contains('open'); }
/* ============ ЗУМ ФОТО ============
Компьютер: клик — приблизить в 2.5× (фото следует за мышью), ещё клик — отдалить; колесо — плавный зум.
Телефон: щипок двумя пальцами, двойной тап, перетаскивание одним пальцем.
Всё анимируется в одном цикле requestAnimationFrame: масштаб идёт с постоянной скоростью,
а движение мыши просто меняет «куда смотреть» — поэтому зум не замедляется, если двигать мышь. */
const ZOOM_CLICK = 2.5, ZOOM_MAX = 4, ZOOM_MS = 350;
const zoom = {
s:1, tx:0, ty:0,          // цель
ds:1, dtx:0, dty:0,       // то, что сейчас на экране
mode:'mouse', fx:0.5, fy:0.5,
anim:null, raf:0, last:0,
pointers:new Map(), pinch:null, pan:null, tap:null, lastTap:null, tapTimer:null
};
const lbWrap = () => document.getElementById('lbPhotoWrap');
const lbImgEl = () => document.getElementById('lbImg');
const lbEl = () => document.getElementById('lightbox');
function isZoomed(){ return zoom.s > 1.001; }
function zoomLimits(sc){
const w = lbWrap().clientWidth, h = lbWrap().clientHeight;
return { mx:(sc - 1) * w / 2, my:(sc - 1) * h / 2 };
}
function clampT(sc, x, y){
const L = zoomLimits(sc);
return [Math.max(-L.mx, Math.min(L.mx, x)), Math.max(-L.my, Math.min(L.my, y))];
}
function renderZoom(){
const img = lbImgEl();
img.style.transition = 'opacity 0.25s ease';
img.style.transform = zoom.ds > 1.001 ? `translate(${zoom.dtx}px, ${zoom.dty}px) scale(${zoom.ds})` : '';
}
function zoomTick(now){
zoom.raf = 0;
const dt = zoom.last ? Math.min(64, now - zoom.last) : 16;
zoom.last = now;
let busy = false;
if (zoom.anim) {
const a = zoom.anim, pr = Math.min(1, (now - a.start) / ZOOM_MS), e = 1 - Math.pow(1 - pr, 3);
zoom.ds = a.from + (a.to - a.from) * e;
if (zoom.mode === 'touch') {
if (a.anchor) { zoom.dtx = a.anchor.dx - a.anchor.ux * zoom.ds; zoom.dty = a.anchor.dy - a.anchor.uy * zoom.ds; }
else { zoom.dtx = a.tx0 + (zoom.tx - a.tx0) * e; zoom.dty = a.ty0 + (zoom.ty - a.ty0) * e; }
[zoom.dtx, zoom.dty] = clampT(zoom.ds, zoom.dtx, zoom.dty);
}
if (pr < 1) busy = true; else { zoom.anim = null; zoom.ds = zoom.s; }
} else if (zoom.mode === 'mouse') {
const k = 1 - Math.exp(-dt / 70);
zoom.ds += (zoom.s - zoom.ds) * k;
if (Math.abs(zoom.s - zoom.ds) > 0.002) busy = true; else zoom.ds = zoom.s;
} else {
zoom.ds = zoom.s;
}
if (zoom.mode === 'mouse') {
const L = zoomLimits(zoom.ds);
const tx = (0.5 - zoom.fx) * 2 * L.mx, ty = (0.5 - zoom.fy) * 2 * L.my;
if (zoom.anim || busy) { zoom.dtx = tx; zoom.dty = ty; }  // пока меняется масштаб — точка под курсором стоит на месте
else {
const k = 1 - Math.exp(-dt / 70);
zoom.dtx += (tx - zoom.dtx) * k; zoom.dty += (ty - zoom.dty) * k;
if (Math.abs(tx - zoom.dtx) > 0.3 || Math.abs(ty - zoom.dty) > 0.3) busy = true;
else { zoom.dtx = tx; zoom.dty = ty; }
}
} else if (!zoom.anim) {
zoom.dtx = zoom.tx; zoom.dty = zoom.ty;
}
renderZoom();
if (busy) zoomKick();
else {
zoom.last = 0;
if (zoom.ds <= 1.001) lbEl().classList.remove('zoom-clip');
}
}
function zoomKick(){ if (!zoom.raf) zoom.raf = requestAnimationFrame(zoomTick); }
function setZoomed(on){
lbEl().classList.toggle('zoomed', on);
if (on) { lbEl().classList.add('zoom-clip'); upgradeLbFull(); }
}
function animateZoom(to, anchor){
const a = { from:zoom.ds, to, start:performance.now(), tx0:zoom.dtx, ty0:zoom.dty };
if (zoom.mode === 'touch' && anchor) {
const r = lbWrap().getBoundingClientRect();
const dx = anchor.x - (r.left + r.width / 2), dy = anchor.y - (r.top + r.height / 2);
a.anchor = { dx, dy, ux:(dx - zoom.dtx) / zoom.ds, uy:(dy - zoom.dty) / zoom.ds };
[zoom.tx, zoom.ty] = clampT(to, dx - a.anchor.ux * to, dy - a.anchor.uy * to);
}
zoom.s = to;
if (to <= 1) { zoom.tx = zoom.ty = 0; }
zoom.anim = a;
setZoomed(to > 1);
zoomKick();
}
function resetZoom(smooth){
clearTimeout(zoom.tapTimer);
zoom.pointers.clear(); zoom.pinch = zoom.pan = zoom.tap = null;
if (zoom.ds <= 1.001 && zoom.s <= 1.001 && !lbImgEl().style.transform) return;
if (smooth) { animateZoom(1); return; }
if (zoom.raf) { cancelAnimationFrame(zoom.raf); zoom.raf = 0; }
zoom.s = zoom.ds = 1; zoom.tx = zoom.ty = zoom.dtx = zoom.dty = 0; zoom.anim = null; zoom.last = 0;
renderZoom();
lbEl().classList.remove('zoomed', 'zoom-clip');
}
function setCursorFraction(x, y){
const r = lbWrap().getBoundingClientRect();
zoom.fx = Math.max(0, Math.min(1, (x - r.left) / r.width));
zoom.fy = Math.max(0, Math.min(1, (y - r.top) / r.height));
}
function touchTakeOver(){
zoom.mode = 'touch';
if (zoom.anim) { zoom.anim = null; zoom.s = zoom.ds; zoom.tx = zoom.dtx; zoom.ty = zoom.dty; }
}
function zoomBlocked(e){
return !lbEl().classList.contains('active')
|| isReadOpen()
|| document.getElementById('lbInfo').classList.contains('open')
|| (e && e.target.closest && e.target.closest('button, .lb-read'));
}
(function initZoom(){
const wrap = lbWrap();
wrap.addEventListener('pointerdown', e => {
if (zoomBlocked(e)) return;
zoom.pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
if (e.pointerType === 'mouse') { zoom.tap = { x:e.clientX, y:e.clientY, t:Date.now() }; return; }
touchTakeOver();
if (zoom.pointers.size === 2) {
const [a, b] = [...zoom.pointers.values()];
zoom.pinch = { d0:Math.hypot(a.x - b.x, a.y - b.y) || 1, s0:zoom.s, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2 };
zoom.tap = null; zoom.pan = null;
} else if (zoom.pointers.size === 1) {
zoom.pan = { x:e.clientX, y:e.clientY, tx0:zoom.tx, ty0:zoom.ty };
zoom.tap = { x:e.clientX, y:e.clientY, t:Date.now() };
}
});
document.addEventListener('pointermove', e => {
if (e.pointerType !== 'mouse' || zoom.mode !== 'mouse') return;
if (!isZoomed() && !zoom.anim) return;
if (!lbEl().classList.contains('active')) return;
setCursorFraction(e.clientX, e.clientY);
zoomKick();
});
wrap.addEventListener('pointermove', e => {
if (e.pointerType === 'mouse' || !zoom.pointers.has(e.pointerId)) return;
zoom.pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
if (zoom.tap && Math.hypot(e.clientX - zoom.tap.x, e.clientY - zoom.tap.y) > 10) zoom.tap = null;
const r = wrap.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
if (zoom.pinch && zoom.pointers.size >= 2) {
const [a, b] = [...zoom.pointers.values()];
const d = Math.hypot(a.x - b.x, a.y - b.y);
const newS = Math.max(1, Math.min(ZOOM_MAX, zoom.pinch.s0 * d / zoom.pinch.d0));
const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
const ux = (zoom.pinch.mx - cx - zoom.tx) / zoom.s, uy = (zoom.pinch.my - cy - zoom.ty) / zoom.s;
zoom.s = newS;
[zoom.tx, zoom.ty] = clampT(newS, (mx - cx) - ux * newS, (my - cy) - uy * newS);
zoom.pinch.mx = mx; zoom.pinch.my = my;
setZoomed(newS > 1.001);
zoomKick();
} else if (zoom.pan && isZoomed()) {
[zoom.tx, zoom.ty] = clampT(zoom.s, zoom.pan.tx0 + (e.clientX - zoom.pan.x), zoom.pan.ty0 + (e.clientY - zoom.pan.y));
zoomKick();
}
});
const end = e => {
if (!zoom.pointers.has(e.pointerId)) return;
zoom.pointers.delete(e.pointerId);
const tap = zoom.tap && e.type === 'pointerup' && Date.now() - zoom.tap.t < 350
&& Math.hypot(e.clientX - zoom.tap.x, e.clientY - zoom.tap.y) < (e.pointerType === 'mouse' ? 6 : 10) ? zoom.tap : null;
zoom.tap = null;
if (e.pointerType === 'mouse') {
if (!tap || e.button !== 0) return;
zoom.mode = 'mouse';
setCursorFraction(e.clientX, e.clientY);
animateZoom(isZoomed() ? 1 : ZOOM_CLICK);
return;
}
if (zoom.pinch && zoom.pointers.size < 2) {
zoom.pinch = null;
if (zoom.s < 1.08) { animateZoom(1); }
const rest = [...zoom.pointers.values()][0];
zoom.pan = rest ? { x:rest.x, y:rest.y, tx0:zoom.tx, ty0:zoom.ty } : null;
return;
}
if (zoom.pointers.size === 0) zoom.pan = null;
if (!tap) return;
const now = Date.now(), last = zoom.lastTap;
if (last && now - last.t < 300 && Math.hypot(tap.x - last.x, tap.y - last.y) < 40) {
clearTimeout(zoom.tapTimer); zoom.lastTap = null;
zoom.mode = 'touch';
animateZoom(isZoomed() ? 1 : ZOOM_CLICK, tap);
} else {
zoom.lastTap = { x:tap.x, y:tap.y, t:now };
clearTimeout(zoom.tapTimer);
zoom.tapTimer = setTimeout(() => {
zoom.lastTap = null;
if (!isZoomed() && lbEl().classList.contains('fs-mode')) lbEl().classList.remove('fs-mode');
}, 300);
}
};
wrap.addEventListener('pointerup', end);
wrap.addEventListener('pointercancel', end);
wrap.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') zoom.pointers.delete(e.pointerId); });
wrap.addEventListener('wheel', e => {
if (zoomBlocked(e)) return;
e.preventDefault();
zoom.mode = 'mouse';
setCursorFraction(e.clientX, e.clientY);
const k = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
const newS = Math.max(1, Math.min(ZOOM_MAX, zoom.s * k));
if (newS < 1.03) { if (isZoomed()) animateZoom(1); return; }
zoom.anim = null;
zoom.s = newS;
setZoomed(true);
zoomKick();
}, { passive:false });
window.addEventListener('resize', () => { resetZoom(false); unlockLbSize(); });
})();
let readResetTimer = null;
function closeLightbox(){
clearTimeout(readResetTimer);
readResetTimer = setTimeout(() => {
if (!document.getElementById('lightbox').classList.contains('active')) { setReadOpen(false, true); resetZoom(false); }
}, 400);
cancelLbAnim();
document.getElementById('lightbox').classList.remove('active');
document.body.style.overflow = '';
}
function navLightbox(dir){
resetZoom(false);
unlockLbSize();
setReadOpen(false);
const pos = viewOrder.indexOf(lbIndex);
const newPos = (pos + dir + viewOrder.length) % viewOrder.length;
lbIndex = viewOrder[newPos];
visitedInSession.add(lbIndex);
if (lbIndex === startIndex && visitedInSession.size === photos.length) {
fullLoopSeen = true;
}
if (!photos[lbIndex].transcript) document.getElementById('lbReadBtn').classList.add('gone');
swapLightboxPhoto();
}
document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => {
if (!document.getElementById('lightbox').classList.contains('active')) return;
if (e.key === 'Escape') { if (isZoomed()) resetZoom(true); else if (isReadOpen()) setReadOpen(false); else closeLightbox(); }
if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey && !e.altKey && photos[lbIndex].transcript) toggleRead();
if (e.key === 'ArrowLeft') navLightbox(-1);
if (e.key === 'ArrowRight') navLightbox(1);
});
</script>
