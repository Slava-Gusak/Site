="1",t.style.opacity="1"}initOrbs();let clickCount=0,clickTimer=null;function toggleHiddenSocials(){if(3===++clickCount){const e=document.getElementById("hiddenSocials"),t=!e.classList.contains("show");e.classList.toggle("show"),document.body.classList.toggle("gradient-active"),t?e.addEventListener("transitionend",function t(o){"max-height"===o.propertyName&&(e.classList.add("expanded"),e.removeEventListener("transitionend",t),window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"}))}):e.classList.remove("expanded"),clickCount=0}clearTimeout(clickTimer),clickTimer=setTimeout(()=>{clickCount=0},1e3)}function shakeSoon(e){e.classList.remove("shaking"),e.offsetWidth,e.classList.add("shaking"),e.addEventListener("animationend",()=>e.classList.remove("shaking"),{once:!0})}function toggleMenu(){document.getElementById("mainMenu").classList.toggle("active"),document.getElementById("menuOverlay").classList.toggle("active"),document.getElementById("menuBtn").classList.toggle("open")}!function(){const e=document.getElementById("homeLink"),t=document.getElementById("warrenLink"),o=document.getElementById("warrenGlow");if(!e||!t||!o)return;let n=null,s=null,a=null,i=!1,l=!1,r=!1;function m(){cancelAnimationFrame(a),a=null,e.classList.remove("warren-charging"),o.style.opacity="0"}function d(e){s||(s=e);const n=Math.min((e-s)/3e3,1);o.style.opacity=String(n),n<1?a=requestAnimationFrame(d):(m(),r=!0,i||(i=!0,t.classList.add("revealed"),t.style.pointerEvents="auto"))}function c(){n=null,s=null,e.classList.add("warren-charging"),a=requestAnimationFrame(d)}function u(e){"mousedown"===e.type&&0!==e.button||(l=!0,i||(n=setTimeout(c,3e3)))}function h(){const t=e.classList.contains("warren-charging"),o=null!==n,s=l,a=r;l=!1,r=!1,clearTimeout(n),n=null,i?s&&!a&&(location.href="/"):(m(),t?shakeSoon(e):o&&(location.href="/"))}e.addEventListener("mousedown",u),e.addEventListener("touchstart",u,{passive:!0}),document.addEventListener("mouseup",h),document.addEventListener("touchend",h),document.addEventListener("touchcancel",h),e.addEventListener("contextmenu",e=>e.preventDefault())}();let currentLang="ru";function switchLanguage(){const e="ru"===currentLang?"en":"ru";document.getElementById("langBtn").textContent="ru"===e?"EN":"RU",document.querySelectorAll("[data-ru][data-en]").forEach(t=>t.textContent="ru"===e?t.getAttribute("data-ru"):t.getAttribute("data-en")),currentLang=e,renderGrids(),document.getElementById("lightbox").classList.contains("active")&&(updateLbText(),isReadOpen()&&(renderTranscript(photos[lbIndex].transcript[currentLang]),setReadOpen(!0)))}const PAPER_TEXT={source:"Новости ЕВРАЗа · 29.12.2011",title:"Мама, папа, я — талантливая семья",lead:"23 декабря в МВЦ НТМК открылась большая новогодняя выставка декоративно-прикладного творчества по итогам конкурса «Талантливая семья ЕВРАЗа». В этот раз в ней приняли участие 80 семей работников уральских предприятий компании — НТМК, ВГОКа, НСМЗ и КГОКа.",body:["Многие конкурсанты претендовали на первые места сразу в нескольких номинациях, а всего их было пять: изобразительное, техническое декоративно-прикладное творчество, рукоделие, жанровая фотография и оригинальное хобби.","— Когда пять лет назад мы впервые организовали такой конкурс, очень надеялись, что он понравится работникам ЕВРАЗа, — рассказала Елена Раудштейн. — Сегодня на выставке представлено уже более 700 работ. В числе авторов — ребята из подшефных социальных учреждений и детских домов. Мы рады, что в конкурсе активно принимают участие дети, ведь если родители делают мир сильнее, то дети — краше.",["Торжественную церемонию награждения открыла ",{hl:"семья музыкантов Гусак: Виктор, Мила и их трехлетний сын Святослав"},". Малыш недавно взял в руки ",{hl:"свою первую в жизни скрипку"},", а уже выступил в ансамбле с родителями и сыграл песенку «Маленькая елочка»."],"В зрительном зале также собралось немало тех, кто только делает свои первые шаги в искусстве. Например, Настя Шилова всего второй год посещает художественную школу, а к конкурсу успела подготовить пять различных работ.","— Мама прочитала в корпоративной газете о конкурсе, — рассказывает Настя, — и предложила поучаствовать. Для выставки я выбрала свои лучшие рисунки.","Мама девочки — инженер управления подготовки производства «ЕВРАЗ НТМК» Лидия Шилова призналась, что гордится успехами дочери и очень хотела, чтобы все узнали, какая талантливая у нее Настюша. Возможно, девочка выберет другую профессию, но любовь к творчеству останется, как, например, у дефектоскописта ультразвукового контроля РБЦ Ольги Рыжковой:","— Я в детстве с огромным удовольствием ходила в изостудию, однако профессию выбрала другую. Работу свою я люблю, но и дополнительных увлечений у меня масса. Я вяжу, шью, занимаюсь резьбой по дереву и бисероплетением. В конкурсе «Талантливая семья ЕВРАЗа» участвую в четвертый раз. В этом году принесла работы в технике декупаж, которой недавно увлеклась.","Ольга Рыжкова не только постоянный участник конкурса, но и его убежденный сторонник.","— Это очень важное и нужное дело, — считает она. — Ведь наша жизнь состоит не только из работы. Приходя домой, мы находим время для хобби. А узнать о том, кто чем увлечен, очень интересно. Я в цехе рассказала, чем мне нравится этот конкурс, и, видимо, убедила: в этот раз коллеги тоже принесли свои работы.","Среди последователей Ольги — грузчик Юрий Машков, который в этом году специально к конкурсу сделал оригинального дракона из ракушек, и Лариса Павлова, оператор ЭВМ (складское хозяйство). Она увлекается вязанием крючком жакетов и салфеток.","— Это прекрасная возможность в рамках большой общей выставки подготовить свою, — считает она. — Сама я никогда не справлюсь с этой задачей — некогда, да и просто не знаю, как это делается. А «Талантливая семья ЕВРАЗа» — отличная возможность на других посмотреть, научиться чему-то новому и себя показать.","Все участники и победители конкурса получили из рук управляющего директора «ЕВРАЗ НТМК» памятные подарки и дипломы."],author:"Татьяна Алеева"},PAPER_TEXT_EN={source:"EVRAZ News · 29.12.2011",title:"Mom, Dad and Me — a Talented Family",lead:"On December 23, a large New Year exhibition of decorative and applied art opened at the NTMK Museum and Exhibition Center, showcasing the results of the “Talented EVRAZ Family” contest. This time, 80 families of employees from the company’s Ural enterprises — NTMK, VGOK, NSMZ and KGOK — took part.",body:["Many contestants competed for first place in several categories at once, and there were five in total: fine art, technical and decorative-applied art, handicrafts, genre photography and original hobbies.","“When we organized this contest for the first time five years ago, we really hoped EVRAZ employees would like it,” said Elena Raudshtein. “Today the exhibition features more than 700 works. Among the authors are children from the social institutions and orphanages we support. We’re glad that children take an active part in the contest — after all, if parents make the world stronger, children make it more beautiful.”",["The awards ceremony was opened by ",{hl:"the Gusak family of musicians: Viktor, Mila and their three-year-old son Svyatoslav"},". The little one only recently picked up ",{hl:"the first violin of his life"},", yet he has already performed in an ensemble with his parents, playing the song “Little Christmas Tree.”"],"The audience also included many who are just taking their first steps in art. Nastya Shilova, for example, has been attending art school for only two years, yet she managed to prepare five different works for the contest.","“Mom read about the contest in the company newspaper,” Nastya says, “and suggested I take part. I chose my best drawings for the exhibition.”","The girl’s mother, Lidia Shilova, an engineer in the production preparation department at EVRAZ NTMK, admitted that she is proud of her daughter’s achievements and really wanted everyone to know how talented her Nastyusha is. Perhaps the girl will choose a different profession, but her love of creativity will stay — as it did, for example, for Olga Ryzhkova, an ultrasonic flaw detection technician at the rail and structural steel shop:","“As a child, I loved going to an art studio, but I chose a different profession. I love my job, but I also have plenty of other hobbies. I knit, sew, do woodcarving and beadwork. This is my fourth time taking part in the ‘Talented EVRAZ Family’ contest. This year I brought pieces made in decoupage, a technique I took up recently.”","Olga Ryzhkova is not only a regular participant in the contest but also a firm supporter of it.","“This is a very important and worthwhile thing,” she believes. “After all, our life isn’t only about work. When we come home, we find time for hobbies. And it’s really interesting to learn what other people are passionate about. I told people at my shop why I like this contest, and apparently I convinced them: this time my colleagues brought their work too.”","Among Olga’s followers are loader Yuri Mashkov, who made an original dragon out of seashells especially for this year’s contest, and Larisa Pavlova, a computer operator in the warehouse department. She crochets jackets and doilies.","“It’s a wonderful opportunity to put together your own exhibition within a big shared one,” she says. “I’d never manage that on my own — I don’t have the time, and I simply don’t know how it’s done. But the ‘Talented EVRAZ Family’ contest is a great chance to see what others do, learn something new and show yourself.”","All participants and winners of the contest received commemorative gifts and diplomas from the managing director of EVRAZ NTMK."],author:"Tatyana Aleeva"},photos=[{src:"img/full/28.09.2025.avif",thumb:"img/thumb/28.09.2025.avif",ru:"28 августа 2025",en:"August 28, 2025",storyRu:"",storyEn:""},{src:"img/full/8.09.2025.avif",thumb:"img/thumb/8.09.2025.avif",ru:"8 сентября 2025",en:"September 8, 2025",storyRu:"",storyEn:""},{src:"img/full/1_5.06.2025.avif",thumb:"img/t
